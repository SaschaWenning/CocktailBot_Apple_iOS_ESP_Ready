workflows:
  ios-simulator-check:
    name: CocktailBot iOS Check (ohne Signierung)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "de.cocktailbot.app"
    scripts:
      - name: iOS-Xcode-Projekt erzeugen und für ESP vorbereiten
        script: |
          set -e
          python3 tool/prepare_ios.py --bundle-id "$BUNDLE_ID"
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          echo "iOS Xcode project and CocktailBot app icon are ready."
      - name: Flutter-Pakete laden
        script: flutter pub get
      - name: Apple-Review Plattformhinweise prüfen
        script: |
          if grep -RniE "Android|Google Play|Play Store" lib assets 2>/dev/null; then
            echo "Nicht erlaubter Hinweis auf andere mobile Plattform im sichtbaren App-Inhalt gefunden."
            exit 1
          fi
          echo "Keine sichtbaren Hinweise auf andere mobile Plattformen gefunden."
      - name: CocoaPods installieren
        script: |
          if [ -f ios/Podfile ]; then
            echo "Podfile gefunden - CocoaPods wird installiert."
            cd ios
            pod install
          else
            echo "Kein Podfile vorhanden - CocoaPods wird übersprungen."
          fi
      - name: iOS-Datenschutzhinweise prüfen
        script: |
          python3 - <<'PY'
          import plistlib
          with open('ios/Runner/Info.plist', 'rb') as f:
              p = plistlib.load(f)
          required = [
              'NSLocalNetworkUsageDescription',
              'NSPhotoLibraryUsageDescription',
              'NSCameraUsageDescription',
              'NSLocationWhenInUseUsageDescription',
          ]
          missing = [k for k in required if not p.get(k)]
          if missing:
              raise SystemExit('Fehlende Info.plist-Schlüssel: ' + ', '.join(missing))
          print('Alle erforderlichen iOS-Datenschutzhinweise vorhanden.')
          if p.get('ITSAppUsesNonExemptEncryption') is not False:
              raise SystemExit('ITSAppUsesNonExemptEncryption fehlt oder ist nicht false.')
          PY
      - name: iOS-Simulator-Build
        script: flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: CocktailBot iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.cocktailbot.app
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "de.cocktailbot.app"
    scripts:
      - name: iOS-Xcode-Projekt erzeugen und für ESP vorbereiten
        script: |
          set -e
          python3 tool/prepare_ios.py --bundle-id "$BUNDLE_ID"
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          echo "iOS Xcode project and CocktailBot app icon are ready."
      - name: Flutter-Pakete laden
        script: flutter pub get
      - name: Apple-Review Plattformhinweise prüfen
        script: |
          if grep -RniE "Android|Google Play|Play Store" lib assets 2>/dev/null; then
            echo "Nicht erlaubter Hinweis auf andere mobile Plattform im sichtbaren App-Inhalt gefunden."
            exit 1
          fi
          echo "Keine sichtbaren Hinweise auf andere mobile Plattformen gefunden."
      - name: CocoaPods installieren
        script: |
          if [ -f ios/Podfile ]; then
            echo "Podfile gefunden - CocoaPods wird installiert."
            cd ios
            pod install
          else
            echo "Kein Podfile vorhanden - CocoaPods wird übersprungen."
          fi
      - name: iOS-Datenschutzhinweise prüfen
        script: |
          python3 - <<'PY'
          import plistlib
          with open('ios/Runner/Info.plist', 'rb') as f:
              p = plistlib.load(f)
          required = [
              'NSLocalNetworkUsageDescription',
              'NSPhotoLibraryUsageDescription',
              'NSCameraUsageDescription',
              'NSLocationWhenInUseUsageDescription',
          ]
          missing = [k for k in required if not p.get(k)]
          if missing:
              raise SystemExit('Fehlende Info.plist-Schlüssel: ' + ', '.join(missing))
          print('Alle erforderlichen iOS-Datenschutzhinweise vorhanden.')
          if p.get('ITSAppUsesNonExemptEncryption') is not False:
              raise SystemExit('ITSAppUsesNonExemptEncryption fehlt oder ist nicht false.')
          PY
      - name: Apple-Code-Signierung anwenden
        script: xcode-project use-profiles
      - name: Signierte IPA bauen
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Cocktailbilder im fertigen IPA prüfen
        script: |
          set -e
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          TMP_DIR="$(mktemp -d)"
          unzip -q "$IPA" -d "$TMP_DIR"
          APP="$(find "$TMP_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"

          FLUTTER_ASSETS="$APP/Frameworks/App.framework/flutter_assets"
          test -d "$FLUTTER_ASSETS"

          for IMAGE in \
            "assets/drinks/cocktailbot/big-john.png" \
            "assets/drinks/cocktailbot/mojito.png" \
            "assets/drinks/cocktailbot/sex-on-the-beach.png" \
            "assets/drinks/cocktailbot/virgin-colada.png"
          do
            if [ ! -f "$FLUTTER_ASSETS/$IMAGE" ]; then
              echo "FEHLER: Cocktailbild fehlt im signierten IPA: $IMAGE"
              exit 1
            fi
          done

          COUNT="$(find "$FLUTTER_ASSETS/assets/drinks/cocktailbot" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Cocktailbilder im signierten IPA: $COUNT"
          if [ "$COUNT" -lt 49 ]; then
            echo "FEHLER: Zu wenige Cocktailbilder im signierten IPA."
            exit 1
          fi

          echo "OK: Cocktailbilder sind im signierten IPA enthalten."
      - name: App-Icon im fertigen IPA prüfen
        script: |
          set -e
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          TMP_DIR="$(mktemp -d)"
          unzip -q "$IPA" -d "$TMP_DIR"
          APP="$(find "$TMP_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/Assets.car"

          echo "Prüfe primäres App-Icon im signierten App-Bundle:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist"

          ICON_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" 2>/dev/null || true)"
          if [ "$ICON_NAME" != "AppIcon" ]; then
            echo "FEHLER: Primäres App-Icon ist nicht als AppIcon registriert (gefunden: '$ICON_NAME')."
            exit 1
          fi

          echo "OK: Das signierte IPA enthält Assets.car und verwendet AppIcon als primäres App-Icon."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
